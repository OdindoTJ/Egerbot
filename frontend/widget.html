<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EgerBot Widget</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; }

  #egerbot-root {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    z-index: 99999;
  }

  /* ── Notification bubble ── */
  #notif-bubble {
    background: #fff;
    border: 1.5px solid #c8e6c9;
    border-radius: 16px;
    padding: 12px 14px;
    max-width: 230px;
    box-shadow: 0 8px 32px rgba(27,94,32,.18);
    display: flex; align-items: flex-start; gap: 9px;
    animation: bubbleIn .4s cubic-bezier(.34,1.56,.64,1) both;
    cursor: pointer; position: relative;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(12px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .nb-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #f9a825; overflow: hidden;
  }
  .nb-avatar img { width: 22px; height: 22px; object-fit: contain; }
  .nb-body { flex: 1; }
  .nb-name { font-size: 11.5px; font-weight: 700; color: #1b5e20; margin-bottom: 2px; }
  .nb-msg  { font-size: 12px; color: #3d503d; line-height: 1.4; }
  .nb-close {
    position: absolute; top: 6px; right: 8px;
    font-size: 17px; color: #8a9e8a; background: none; border: none;
    cursor: pointer; line-height: 1; transition: color .15s;
  }
  .nb-close:hover { color: #1b5e20; }

  /* ── FAB ── */
  #egerbot-fab {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(145deg, #2e7d32, #1b5e20);
    border: 3px solid #f9a825;
    box-shadow: 0 6px 24px rgba(27,94,32,.45), 0 2px 8px rgba(0,0,0,.12);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative; transition: transform .2s ease, box-shadow .2s ease;
    overflow: visible;
  }
  #egerbot-fab:hover {
    transform: scale(1.1) translateY(-2px);
    box-shadow: 0 10px 32px rgba(27,94,32,.5);
  }
  #egerbot-fab:active { transform: scale(.96); }

  .fab-logo { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 1px 4px rgba(0,0,0,.3)); }

  /* Pulse ring */
  #egerbot-fab::before {
    content: ''; position: absolute; inset: -8px;
    border-radius: 50%; border: 2.5px solid rgba(46,125,50,.35);
    animation: fab-pulse 2.5s ease-out infinite;
  }
  @keyframes fab-pulse {
    0%   { transform: scale(1);    opacity: .8; }
    70%  { transform: scale(1.4);  opacity: 0; }
    100% { transform: scale(1.4);  opacity: 0; }
  }

  /* Badge */
  .fab-badge {
    position: absolute; top: -3px; right: -3px;
    width: 18px; height: 18px; background: #c62828; border-radius: 50%;
    border: 2px solid #fff; font-size: 9px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    animation: pop .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* Tooltip */
  .fab-tip {
    position: absolute; bottom: 68px; right: 0;
    background: #111; color: #fff; font-size: 11.5px; font-weight: 500;
    padding: 5px 10px; border-radius: 7px; white-space: nowrap;
    pointer-events: none; opacity: 0; transform: translateY(5px);
    transition: opacity .15s, transform .15s;
  }
  #egerbot-fab:hover .fab-tip { opacity: 1; transform: translateY(0); }

  @media (max-width: 480px) {
    #egerbot-root { bottom: 16px; right: 16px; }
    #egerbot-fab  { width: 54px; height: 54px; }
  }
</style>
</head>
<body>
<div id="egerbot-root">

  <div id="notif-bubble" role="button" tabindex="0" aria-label="Open EgerBot chat">
    <div class="nb-avatar">
      <img src="assets/logo.png" alt="EgerBot"/>
    </div>
    <div class="nb-body">
      <p class="nb-name">EgerBot 🎓</p>
      <p class="nb-msg">Have questions about joining Egerton? I'm here to help!</p>
    </div>
    <button class="nb-close" id="notifClose" aria-label="Dismiss">&times;</button>
  </div>

  <button id="egerbot-fab" aria-label="Open EgerBot — Egerton University Assistant">
    <img src="assets/logo.png" alt="EgerBot" class="fab-logo"/>
    <span class="fab-badge" id="fabBadge">1</span>
    <span class="fab-tip">Chat with EgerBot</span>
  </button>

</div>

<script>
(function(){
  // ── Config ────────────────────────────────────────────────────────────────
  // Full path to the chat page — change to absolute URL in production
  const CHAT_URL = "./index.html";

  const fab        = document.getElementById("egerbot-fab");
  const notif      = document.getElementById("notif-bubble");
  const notifClose = document.getElementById("notifClose");
  const badge      = document.getElementById("fabBadge");

  // ── Open full chat in new tab ─────────────────────────────────────────────
  function openChat(){
    window.open(CHAT_URL, "_blank", "noopener,noreferrer");
    dismissNotif();
  }

  fab.addEventListener("click", openChat);
  notif.addEventListener("click", function(e){
    if(e.target === notifClose || notifClose.contains(e.target)) return;
    openChat();
  });
  notif.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openChat(); }
  });

  // ── Dismiss notification ──────────────────────────────────────────────────
  function dismissNotif(){
    notif.style.transition  = "opacity .25s ease, transform .25s ease";
    notif.style.opacity     = "0";
    notif.style.transform   = "translateY(8px) scale(.95)";
    badge.style.transition  = "transform .2s ease";
    badge.style.transform   = "scale(0)";
    setTimeout(()=>{ notif.style.display="none"; badge.style.display="none"; }, 260);
    try{ sessionStorage.setItem("egerbot_dismissed","1"); }catch(_){}
  }

  notifClose.addEventListener("click", function(e){
    e.stopPropagation();
    dismissNotif();
  });

  // ── Auto-dismiss after 8s, or if previously dismissed ────────────────────
  try{
    if(sessionStorage.getItem("egerbot_dismissed")){
      notif.style.display = "none";
      badge.style.display = "none";
    } else {
      setTimeout(dismissNotif, 8000);
    }
  }catch(_){ setTimeout(dismissNotif, 8000); }

})();
</script>
</body>
</html>
